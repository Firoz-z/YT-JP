name: Daily Japanese Word Video

on:
  schedule:
    - cron: "0 8 * * *"    # slot 0 — 8 AM UTC  (Asia/India morning, UK breakfast)
    - cron: "0 14 * * *"   # slot 1 — 2 PM UTC  (India evening peak, UK afternoon)
    - cron: "0 19 * * *"   # slot 2 — 7 PM UTC  (UK prime, US East working hours)
    - cron: "0 23 * * *"   # slot 3 — 11 PM UTC (US East evening peak — biggest English-audience window)
  workflow_dispatch:        # manual trigger (skips random sleep)

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents:write — commit uploads.md; issues:write — open alert on failure
    permissions:
      contents: write
      issues: write

    steps:
      - name: Random delay (0–59 min) — skipped on manual runs
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 3600))

      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
        run: python pipeline.py

      - name: Commit upload history
        # Run even if the pipeline failed — uploads.md only changes when
        # an upload actually succeeded, so committing is always safe.
        if: always()
        run: |
          if [ -f uploads.md ] && ! git diff --quiet uploads.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploads.md
            git commit -m "Log upload: $(date -u +%Y-%m-%d) slot ${{ github.run_id }}"
            git push
          else
            echo "uploads.md unchanged, nothing to commit"
          fi

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Avoid duplicate issues for the same day
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });
            if (open.some(i => i.title.includes(today))) {
              console.log('Alert issue already open for today — skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Pipeline failure — ${today}`,
              body: [
                `The daily pipeline failed on **${today}**.`,
                ``,
                `**Workflow run:** ${runUrl}`,
                ``,
                `**Possible causes:**`,
                `- YouTube OAuth token expired or revoked`,
                `- Jisho API unreachable`,
                `- Groq API down or quota exceeded`,
                `- Pexels API key invalid`,
                `- Video build error (ffmpeg / font issue)`,
                ``,
                `Check the run logs linked above for the exact error.`,
                `Close this issue once resolved.`,
              ].join('\n'),
              labels: ['pipeline-failure'],
            });
